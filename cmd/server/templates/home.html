<!DOCTYPE html>
<!--
Title: home.html
@brief Server Homepage Template File
-->
<html>

<head>
        <meta name="description" content="Homepage for pi-vitrine server" />
        <meta http-equiv="author" content="Channing Ko-Madden" />
        <title>Homepage</title>
        <link href="/styles/output.css" type="text/css" rel="stylesheet" />
        <script src="https://unpkg.com/htmx.org@2.0.2"></script>
        <script src="https://unpkg.com/htmx-ext-path-params@2.0.0/path-params.js"></script>
        <script src="https://go-echarts.github.io/go-echarts-assets/assets/echarts.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-800">

  <h1 class="text-3xl font-bold text-center my-6">pi-vitrine</h1>

  <!-- Device UI Block -->
  <section class="max-w-6xl mx-auto px-4">

    <div class="flex flex-col md:flex-row gap-8">

      <!-- Left column: device forms -->
      <div class="flex-1 space-y-6">

        <!-- Card wrapper -->
        <div class="bg-white shadow p-6 rounded-lg grid gap-6" hx-ext="path-params">

          <!-- List all -->
          <form class="grid gap-3" hx-get="/device" hx-target="#device_info">
            <input type="submit" value="List All Devices"
              class="btn-primary" />
          </form>

          <!-- Get Device Info -->
          <form class="grid gap-3" hx-get="/device/{get_name}"
                hx-include="[get_name='get_name']"
                hx-target="#device_info">
            <input type="text" name="get_name" placeholder="Device name"
                   required
                   class="input" />
            <input type="submit" value="Get Device Info"
                   class="btn-primary" />
          </form>

          <!-- Register device -->
          <form class="grid gap-3" hx-post="/device"
                hx-target="#device_info">
            <input type="text" name="device_name" placeholder="Device name" required class="input" />
            <input type="text" name="device_location" placeholder="Device location" required class="input" />
            <input type="submit" value="Register Device" class="btn-primary" />
          </form>

          <!-- Update device -->
          <form class="grid gap-3"
                hx-patch="/device/{patch_name}"
                hx-include="[patch_name='patch_name']"
                hx-target="#device_info">
            <input type="text" name="patch_name" placeholder="Device name" required class="input" />
            <input type="text" name="device_location" placeholder="Device location" required class="input" />
            <input type="submit" value="Update Location" class="btn-primary" />
          </form>

        </div>
      </div>

      <!-- Right column: device info -->
      <div id="device_info" class="flex-1 bg-white shadow p-6 rounded-lg min-h-[200px]"></div>

    </div>
  </section>

  <!-- Spacing -->
  <div class="h-12"></div>

  <!-- System + Indoor Climate Section -->
  <section class="max-w-6xl mx-auto px-4">

    <div class="flex flex-col md:flex-row gap-8">

      <!-- Left column: system forms -->
      <div class="flex-1">
        <div class="bg-white shadow p-6 rounded-lg grid gap-6" hx-ext="path-params">

          <!-- System Data -->
          <form class="grid gap-3"
                hx-get="/system/{device_name}"
                hx-include="[device_name='device_name']"
                hx-target="#system_data">
            <input type="text" name="device_name" placeholder="Device name" required class="input" />
            <input type="number" name="days" placeholder="Number of days" min="1" required class="input" />
            <input type="submit" value="Get System Data" class="btn-primary" />
          </form>

          <!-- Indoor Climate -->
          <form class="grid gap-3"
                hx-get="/indoor_climate/{device_name}"
                hx-include="[device_name='device_name']"
                hx-target="#indoor_climate_fig">
            <input type="text" name="device_name" placeholder="Device name" required class="input" />
            <input type="number" name="days" placeholder="Number of days" min="1" required class="input" />
            <input type="submit" value="Get Indoor Climate Data" class="btn-primary" />
          </form>

        </div>
      </div>

      <!-- Right column: results -->
      <div class="flex-1 space-y-6">
        <div id="system_data" class="bg-white shadow p-6 rounded-lg min-h-[150px]"></div>
        <div id="indoor_climate_fig" class="bg-white shadow p-6 rounded-lg min-h-[150px]"></div>
      </div>
    </div>
  </section>
</body>

</html>
